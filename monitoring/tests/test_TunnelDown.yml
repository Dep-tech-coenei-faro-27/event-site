rule_files:
  - ../alerts.yml
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'probe_success{job="probe-tunnel", instance="http://tunnel:2000/ready"}'
        values: '1+0x4 0+0x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: TunnelDown
        exp_alerts: []
      - eval_time: 6m
        alertname: TunnelDown
        exp_alerts:
          - exp_labels: { severity: critical, job: probe-tunnel, instance: "http://tunnel:2000/ready" }
            exp_annotations: { summary: "O túnel da Cloudflare está em baixo: o site não é acessível de fora" }