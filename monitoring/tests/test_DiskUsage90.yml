rule_files:
  - ../alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100", job="node"}'
        values: '5+0x10'
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100", job="node"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: DiskUsage90
        exp_alerts: []
      - eval_time: 3m
        alertname: DiskUsage90
        exp_alerts:
          - exp_labels: { severity: critical, mountpoint: "/", fstype: ext4, instance: "node-exporter:9100", job: node }
            exp_annotations: { summary: "Disk usage at 95% (critical)" }
  - interval: 1m                       # 85% usado: o de 90% não dispara
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100", job="node"}'
        values: '15+0x10'
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4", instance="node-exporter:9100", job="node"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskUsage90
        exp_alerts: []