[project]
name = "event-site-backend"
version = "0.1.0"
description = "Backend API for event-site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "bcrypt>=4.1.2",
    "email-validator>=2.1.0",
    "pyjwt>=2.15.0",
    "segno>=1.6.6",
    "python-multipart>=0.0.32",
    "pyhanko>=0.38.0",
    "pyhanko-certvalidator>=0.33.0",
    "cryptography>=50.0.2",
    "pypdf>=6.21.2",
    "lxml>=6.1.3",
    "asn1crypto>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "httpx2>=2.13.0",
    "ruff>=0.1.9",
    "zxing-cpp>=3.1.1",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The fixtures of the proof of enrolment are imported and used as arguments.
"tests/test_student_*.py" = ["F811"]
