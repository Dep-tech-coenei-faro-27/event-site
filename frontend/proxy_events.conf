# Fluxo de eventos do pagamento (Server-Sent Events): uma resposta que não termina e que o servidor
# vai escrevendo. Ao contrário do resto da API, o nginx não pode reter a resposta (buffering) nem
# comprimi-la, senão cada evento só chegava ao browser quando a ligação fechasse. O servidor envia
# um batimento de 15 em 15 segundos, por isso o tempo de espera de 120 s nunca se esgota (e o túnel
# da Cloudflare, que corta ligações caladas, também não).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_buffering off;
proxy_cache off;
gzip off;

# O nginx já envia estes cabeçalhos, para não aparecerem duas vezes.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
