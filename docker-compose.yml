x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Corra docker compose --env-file backend/.env (ver README)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Corra docker compose --env-file backend/.env (ver README)}
      POSTGRES_DB: ${POSTGRES_DB:?Corra docker compose --env-file backend/.env (ver README)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/media:/app/media
      # Comprovativos de estudante à espera de decisão: privada, nunca servida.
      - ./backend/private:/app/private
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    # Só recebe o token do túnel (ficheiro tunnel.env no servidor).
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend

  blackbox:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    pid: "host"
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ${METRICS_DIR:-/home/debian/enei/metrics}:/textfile:ro
    logging: *default-logging

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *default-logging

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ${ALERTMANAGER_CONFIG:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_WEBHOOK_FILE:-/home/debian/enei/alerts/discord_webhook}:/etc/alertmanager/discord_webhook:ro
      - ${ALERT_SMTP_PASSWORD_FILE:-/home/debian/enei/alerts/smtp_password}:/etc/alertmanager/smtp_password:ro
    ports:
      - "127.0.0.1:9093:9093"
    logging: *default-logging

volumes:
  pgdata:
  prometheus_data:
